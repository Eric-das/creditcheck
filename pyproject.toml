[project]
name = "creditcheck"
version = "0.0.1"
description = "Local-first forensic reconciliation engine for AR credit control"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pyodbc>=5.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
gui = [
    # Desktop app (Phase 4): FastAPI backend + pywebview window.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pywebview>=5.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
creditcheck = "creditcheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
